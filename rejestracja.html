<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dołącz do TwarzBlok - Rejestracja</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <h1 class="auth-logo">TwarzBlok</h1>

    <div class="card auth-card">
        <h2 class="text-center m-bottom-10">Utwórz nowe konto</h2>
        <p class="text-muted text-center m-bottom-20 font-size-14">To szybkie i proste. Po rejestracji wyślemy mail potwierdzający.</p>

        <form>
            <div class="form-group">
                <input type="text" class="form-input" placeholder="Imię i nazwisko" required>
            </div>
            <div class="form-group">
                <input type="email" class="form-input" placeholder="Numer telefonu lub adres e-mail" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-input" placeholder="Nowe hasło" required>
            </div>
            <button type="submit" class="btn btn-success w-100 btn-submit-size">Zarejestruj się</button>
        </form>

        <hr>

        <div class="auth-links">
            <a href="#">Masz już konto? Zaloguj się</a>
            <a href="#" class="font-size-13 text-muted">Zapomniałeś hasła? (Przypomnienie e-mail)</a>
        </div>
    </div>
</div>

</body>
</html>
